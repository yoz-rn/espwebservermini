<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris - ESP32</title>
    
    <link rel="stylesheet" href="/assets/core/theme.css">
    <link rel="stylesheet" href="/assets/core/tui-base.css">
    <link rel="stylesheet" href="/assets/core/sidebar.css">
    <link rel="stylesheet" href="game-layout.css">
</head>
<body>

    <button id="sidebar-toggle" aria-label="toggle menu">☰</button>

    <nav id="sidebar">
        <a href="/index.html" class="sidebar-item">
            <span class="icon" style="--icon-url: url('/assets/icons/dashboard.svg')"></span>
            <span class="label">Dashboard</span>
        </a>
        <a href="/wifi-setup.html" class="sidebar-item">
            <span class="icon" style="--icon-url: url('/assets/icons/wifi.svg')"></span>
            <span class="label">WiFi Setup</span>
        </a>
        <a href="/file-manager.html" class="sidebar-item">
            <span class="icon" style="--icon-url: url('/assets/icons/file-manager.svg')"></span>
            <span class="label">File Manager</span>
        </a>

        <div class="sidebar-dropdown open">
            <button class="sidebar-item dropdown-btn" onclick="this.parentElement.classList.toggle('open')">
                <span class="icon" style="--icon-url: url('/assets/icons/game.svg')"></span>
                <span class="label">Games ▼</span>
            </button>
            <div class="dropdown-content">
                <a href="/game.html" class="sidebar-item submenu-item">- Game Hub</a>
                <a href="snek.html" class="sidebar-item submenu-item">- Snek</a>
                <a href="tetris.html" class="sidebar-item submenu-item active">- Tetris</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="game-grid">
            
            <div class="tui-panel game-header-panel" data-label="game">
                <span>/assets/game/tetris/</span>
                <span id="connection-status">Ready</span>
            </div>
            
            <div class="game-left-col">
                <div class="tui-panel" data-label="play area" style="height: 100%;">
                    <div class="game-canvas-container">
                        <canvas id="game-canvas" width="300" height="600"></canvas>
                    </div>
                </div>
            </div>

            <div class="game-right-col">
                
                <div class="tui-panel" data-label="next piece">
                    <div class="next-piece-container">
                        <canvas id="next-piece-canvas" width="100" height="100"></canvas>
                    </div>
                </div>

                <div class="tui-panel" data-label="status">
                    <div class="game-stats">
                        <div class="stat-row">
                            <span>Score</span>
                            <span id="score-display">0</span>
                        </div>
                        <div class="stat-row">
                            <span>High Score</span>
                            <span id="high-score-display">...</span>
                        </div>
                    </div>

                    <div class="game-actions">
                        <button id="btn-start" class="action-btn-large">Start Game</button>
                        <button id="btn-pause" class="action-btn-large">Pause</button>
                        <button id="btn-reset" class="action-btn-large">Reset</button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="/assets/core/sidebar.js"></script>
    <script src="/assets/core/webaudio-tinysynth.js"></script>
    <script src="/assets/game/game-shell.js"></script>
    
    <script>
        const gameName = "tetris";
        const api = new GameAPI(gameName);
        const audio = new GameAudio(gameName);
        let wasmInstance = null;

        api.fetchHighScore().then(score => {
            document.getElementById('high-score-display').innerText = score;
        });

        function onGameOver(finalScore) {
            audio.stopBGM();

            api.submitScore(finalScore).then(result => {
                if (result && result.isNewRecord) {
                    alert("Rekor Baru! Skor: " + result.highScore);
                    document.getElementById('high-score-display').innerText = result.highScore;
                } else {
                    alert("Game Over! Skor: " + finalScore);
                }
            });
        }

        document.getElementById('btn-start').addEventListener('click', async (e) => {
            if (wasmInstance) return;
            e.target.disabled = true;

            audio.playBGM('tetoris.mid', 1);
            wasmInstance = await loadGame("tetris.wasm", "game-canvas");
        });

        document.addEventListener("keydown", (e) => {
            if (!wasmInstance) return;
            const keyMap = { ArrowLeft: 0, ArrowRight: 1, ArrowUp: 2, ArrowDown: 3, " ": 4, Enter: 5 };
            const key = keyMap[e.key];
            if (key !== undefined) {
                e.preventDefault();
                wasmInstance.game_keydown(key);
            }
        });
    </script>
</body>
</html>

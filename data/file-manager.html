<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager</title>
    
    <!-- Memanggil CSS Tema Utama & Komponen -->
    <link rel="stylesheet" href="assets/core/theme.css">
    <link rel="stylesheet" href="assets/core/tui-base.css">
    <link rel="stylesheet" href="assets/core/sidebar.css">
    <link rel="stylesheet" href="assets/file-manager/file-manager.css">
</head>
<body>

    <!-- Tombol Toggle Sidebar (Mobile) -->
    <button id="sidebar-toggle" aria-label="toggle menu">☰</button>

    <!-- Sidebar Navigation -->
    <nav id="sidebar">
        <!-- Aset dashboard.svg adalah placeholder menunggu aset dari Anda -->
        <a href="/index.html" class="sidebar-item">
            <span class="icon" style="--icon-url: url('/assets/icons/dashboard.svg')"></span>
            <span class="label">Dashboard</span>
        </a>

        <a href="/wifi-setup.html" class="sidebar-item">
            <span class="icon" style="--icon-url: url('/assets/icons/wifi.svg')"></span>
            <span class="label">WiFi Setup</span>
        </a>

        <a href="/file-manager.html" class="sidebar-item">
            <span class="icon" style="--icon-url: url('/assets/icons/file-manager.svg')"></span>
            <span class="label">File Manager</span>
        </a>

        <span class="sidebar-item disabled">
            <span class="icon" style="--icon-url: url('/assets/icons/task-manager.svg')"></span>
            <span class="label">Task Manager</span>
        </span>

        <a href="/game.html" class="sidebar-item">
            <span class="icon" style="--icon-url: url('/assets/icons/game.svg')"></span>
            <span class="label">Game</span>
        </a>
    </nav>

    <!-- Wrapper Konten Utama -->
    <main class="main-content">
        
        <!-- Grid Layout untuk menyusun panel secara responsif -->
        <div class="file-manager-grid">
            
            <!-- Panel Kiri: Navigasi File -->
            <div class="tui-panel fm-path-panel" data-label="path">
                <div class="fm-actions">
                    <label for="upload-input" class="action-btn" title="Upload File">
                        <span class="icon" style="--icon-url: url('/assets/file-manager/icons/upload.svg')"></span>
                    </label>
                    <input type="file" id="upload-input" style="display: none;">

                    <button id="btn-mkdir" class="action-btn" title="Buat Folder">
                        <span class="icon" style="--icon-url: url('/assets/file-manager/icons/mkdir.svg')"></span>
                    </button>
                </div>
                <span id="current-path">/</span>
            </div>
                
            <div class="fm-left-col">
                <div class="tui-panel fm-table-panel" data-label="files">
                    <div class="fm-table-scroll">
                        <table id="file-table">
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
                
                <div class="tui-panel" data-label="status">
                    <span id="status-message">when yh</span>
                    <div class="fm-actions">
                        <button id="btn-rename" class="action-btn" title="Ganti Nama">
                            <span class="icon" style="--icon-url: url('/assets/file-manager/icons/rename.svg')"></span>
                        </button>
                        <button id="btn-delete" class="action-btn" title="Hapus">
                            <span class="icon" style="--icon-url: url('/assets/file-manager/icons/delete.svg')"></span>
                        </button>
                    </div>
                </div>
            </div>

            
            <!-- Panel Kanan: Preview Tengah -->
            <div class="fm-right-col">
                <!-- Panel Preview dibuat flex dan ditengahkan -->
                <div class="tui-panel preview-panel" data-label="preview">
                    <div id="preview-content">
                        <em>pilih file untuk melihat isi</em>
                    </div>
                </div>
            </div>
            <div class="tui-panel" data-label="system">
                    <div id="storage-info" class="fm-storage-info">memuat info penyimpanan...</div>
                    <div class="fm-storage-bar">
                        <div id="storage-bar-fill" class="fm-storage-bar-fill"></div>
                    </div>
                    <!-- <div class="fm-separator"></div>                 -->
                    <div class="fm-ascii-scroll">
                    <pre id="fm-ascii">Loading ASCII</pre>
                    </div>
            </div>
            
        </div>

    </main>

    <!-- Memanggil Script -->
    <script src="assets/core/sidebar.js"></script>
    <script src="assets/file-manager/file-manager.js"></script>
</body>
</html>

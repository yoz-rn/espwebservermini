<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Dashboard</title>
    <link rel="stylesheet" href="assets/core/theme.css">
    <link rel="stylesheet" href="assets/core/tui-base.css">
    <link rel="stylesheet" href="assets/dashboard/dashboard.css">
</head>
<body>

    <div class="tui-panel" data-label="dashboard miniserver">
        <p>Hello World! File HTML ini disajikan melalui LittleFS.</p>
        <pre id="ascii-container">Memuat ASCII Art...</pre>
    </div>

    <div class="tui-panel" data-label="menu">
        <div class="feature-grid">
            <a href="wifi-setup.html" class="feature-btn">
                <span class="icon" style="--icon-url: url('/assets/icons/wifi.svg')"></span>
                <span class="feature-label">wifi</span>
            </a>

            <a href="file-manager.html" class="feature-btn">
                <span class="icon" style="--icon-url: url('/assets/icons/file-manager.svg')"></span>
                <span class="feature-label">file manager</span>
            </a>

            <span class="feature-btn disabled">
                <span class="icon" style="--icon-url: url('/assets/icons/task-manager.svg')"></span>
                <span class="feature-label">task manager</span>
                <span class="badge">coming soon</span>
            </span>

            <span class="feature-btn disabled">
                <span class="icon" style="--icon-url: url('/assets/icons/game.svg')"></span>
                <span class="feature-label">game</span>
                <span class="badge">coming soon</span>
            </span>
        </div>
    </div>

    <script>
        fetch('/assets/gz/esp32.txt')
            .then(response => {
                if (!response.ok) throw new Error("Gagal mengambil file");
                return response.text();
            })
            .then(data => {
                document.getElementById('ascii-container').innerText = data;
            })
            .catch(error => {
                document.getElementById('ascii-container').innerText = "Error: " + error;
            });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Setup</title>
    <link rel="stylesheet" href="/assets/core/theme.css">
    <link rel="stylesheet" href="/assets/core/tui-base.css">
    <link rel="stylesheet" href="/assets/core/sidebar.css">
    <link rel="stylesheet" href="/assets/wifi-setup/wifi-setup.css">
</head>
<body>

    <!-- sidebar -->

    <main class="main-content">
        <div class="wifi-page">

            <div class="tui-panel" data-label="jaringan tersimpan">
                <div id="saved-network" class="saved-network">
                    <!-- diisi JS -->
                </div>
            </div>

            <div class="tui-panel" data-label="tambah jaringan">
                <div class="wifi-container">
                    <img src="/assets/wifi-setup/wifi-login.svg" class="wifi-vector-img" alt="WiFi Login Vector">

                    <form id="wifi-form">
                        <label for="ssid">WiFi Name (SSID)</label>
                        <input type="text" id="ssid" name="ssid" autocomplete="off" required>

                        <label for="password">Password</label>
                        <input type="password" id="password" name="password">

                        <button type="submit">Connect</button>
                        <div id="status"></div>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <!-- Memanggil Script -->
    <script src="/assets/core/sidebar.js"></script> 
    <script src="/assets/wifi-setup/wifi-setup.js"></script>
</body>
</html>

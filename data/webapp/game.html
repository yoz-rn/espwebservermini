<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Game(s)</title>
    <!-- Memuat file CSS utama -->
    <link rel="stylesheet" href="assets/core/theme.css">
    <link rel="stylesheet" href="assets/core/tui-base.css">
    <link rel="stylesheet" href="assets/core/sidebar.css">
    <!-- Memuat file CSS khusus halaman Game -->
    <link rel="stylesheet" href="assets/game/game.css">
</head>
<body>

    <!-- Sidebar -->
        
    <!-- Wrapper Konten Utama -->
    <main class="main-content">
        <!-- Panel Header Game Center -->
        <div class="tui-panel" data-label="game center">
            <p>Pick Games.</p>
            <!-- ASCII Art Statis untuk Game Center -->
            <pre id="ascii-container">Loading ASCII Art...</pre>
        </div>

        <!-- Panel Menu Daftar Game & Skor -->
        <div class="tui-panel" data-label="daftar menu">
            <div class="feature-grid">
                
                <a href="/assets/game/snek.html" class="feature-btn">
                    <span class="icon" style="--icon-url: url('/assets/game/snek/snek.svg')"></span>
                    <span class="feature-label">Snek</span>
                </a>

                <a href="/assets/game/tetris.html" class="feature-btn">
                    <span class="icon" style="--icon-url: url('/assets/game/tetris/tetris.svg')"></span>
                    <span class="feature-label">Tetris</span>
                </a>

                <a href="/assets/game/gol.html" class="feature-btn">
                    <span class="icon" style="--icon-url: url('/assets/game/gol/gol.svg')"></span>
                    <span class="feature-label">Conway's Game of Life</span>
                </a>

                <a href="/assets/game/battleship.html" class="feature-btn">
                    <span class="icon" style="--icon-url: url('/assets/game/battleship/battleship.svg')"></span>
                    <span class="feature-label">Battleship</span>
                </a>

            </div>
        </div>
    </main>

    <!-- Memanggil Script Sidebar & Fetcher ASCII -->
    <script src="assets/core/sidebar.js"></script>
    <script>
        fetch('/assets/game/game-ascii.txt')
            .then(response => {
                if (!response.ok) throw new Error("Gagal mengambil file");
                return response.text();
            })
            .then(data => {
                document.getElementById('ascii-container').innerText = data;
            })
            .catch(error => {
                document.getElementById('ascii-container').innerText = "Error: " + error;
            });
    </script>

</body>
</html>

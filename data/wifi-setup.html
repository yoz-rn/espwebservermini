<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Setup</title>
    
    <!-- Memanggil CSS Tema Utama & Komponen -->
    <link rel="stylesheet" href="assets/core/theme.css">
    <link rel="stylesheet" href="assets/core/tui-base.css">
    <link rel="stylesheet" href="assets/core/sidebar.css">
    <link rel="stylesheet" href="assets/wifi-setup/wifi-setup.css">
</head>
<body>

    <!-- Tombol Toggle Sidebar (Hanya terlihat di Mobile) -->
    <button id="sidebar-toggle">☰</button>

    <!-- Sidebar Navigation -->
    <nav id="sidebar">
        <!-- Aset dashboard.svg adalah placeholder menunggu aset dari Anda -->
        <a href="/index.html" class="sidebar-item">
            <span class="icon" style="--icon-url: url('/assets/icons/dashboard.svg')"></span>
            <span class="label">Dashboard</span>
        </a>

        <a href="/wifi-setup.html" class="sidebar-item">
            <span class="icon" style="--icon-url: url('/assets/icons/wifi.svg')"></span>
            <span class="label">WiFi Setup</span>
        </a>

        <a href="/file-manager.html" class="sidebar-item">
            <span class="icon" style="--icon-url: url('/assets/icons/file-manager.svg')"></span>
            <span class="label">File Manager</span>
        </a>

        <span class="sidebar-item disabled">
            <span class="icon" style="--icon-url: url('/assets/icons/task-manager.svg')"></span>
            <span class="label">Task Manager</span>
        </span>

        <a href="/game.html" class="sidebar-item">
            <span class="icon" style="--icon-url: url('/assets/icons/game.svg')"></span>
            <span class="label">Game</span>
        </a>
    </nav>

    <!-- Wrapper Konten Utama -->
    <main class="main-content">
        <div class="tui-panel" data-label="wifi setup">
            <div class="wifi-container">
                <img src="/assets/wifi-setup/masha-wifi.svg" class="wifi-vector-img" alt="WiFi Login Vector">

                <form id="wifi-form">
                    <label for="ssid">Nama WiFi (SSID)</label>
                    <input type="text" id="ssid" name="ssid" autocomplete="off" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">

                    <button type="submit">Hubungkan</button>
                    <div id="status"></div>
                </form>
            </div>
        </div>
    </main>

    <!-- Memanggil Script -->
    <script src="assets/core/sidebar.js"></script> <!-- Tambahkan sidebar.js -->
    <script src="assets/wifi-setup/wifi-setup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Setup</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        h1 { color: #007BFF; }
        form { display: inline-block; text-align: left; }
        label { display: block; margin-top: 12px; font-size: 14px; }
        input { width: 250px; padding: 8px; margin-top: 4px; }
        button { margin-top: 16px; padding: 8px 16px; }
        #status { margin-top: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Hubungkan ke WiFi</h1>

    <pre id="ascii-container">Memuat ASCII Art...</pre>

    <form id="wifi-form">
        <label for="ssid">Nama WiFi (SSID)</label>
        <input type="text" id="ssid" name="ssid" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password">

        <button type="submit">Hubungkan</button>
    </form>
    <div id="status"></div>

    <script>

        fetch('/assets/taiga.txt')
            .then(response => {
                if (!response.ok) throw new Error("Gagal mengambil file");
                return response.text(); // Browser otomatis mengekstrak Gzip di sini!
            })
            .then(data => {
                console.log(data.length);
                console.log(data.slice(0,100));
                document.getElementById('ascii-container').innerText = data;
            })
            .catch(error => {
                document.getElementById('ascii-container').innerText = "Error: " + error;
            });

        const form = document.getElementById('wifi-form');
        const statusEl = document.getElementById('status');
        const submitBtn = form.querySelector('button');

        let pollTimer = null;

        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
            submitBtn.disabled = false;
        }

        function pollStatus() {
            fetch('/api/wifi-status')
                .then(response => response.text())
                .then(text => {
                    let data;
                    try {
                        data = JSON.parse(text);
                    }
                    catch (err) {
                        console.error('Raw response gagal di-parse:', text);   // BARU — log body mentah ke console
                        statusEl.textContent = 'Error parsing (cek console): ' + text.substring(0, 100);
                        statusEl.style.color = 'red';
                        stopPolling();
                        return;
                    }

                    // Penting: string di bawah ini HARUS sama persis dengan
                    // statusToString() di WifiRoutes.cpp
                    if (data.status === 'SUCCESS') {
                        statusEl.textContent = data.message;
                        statusEl.style.color = 'green';
                        stopPolling();
                    } else if (data.status === 'FAILED') {
                        statusEl.textContent = data.message;
                        statusEl.style.color = 'red';
                        stopPolling();
                    } else if (data.status === 'TESTING') {
                        statusEl.textContent = data.message;
                        statusEl.style.color = 'black';
                        // tetap polling, belum selesai
                    }
                })
                .catch(error => {
                    statusEl.textContent = 'Error saat cek status: ' + error.message;
                    statusEl.style.color = 'red';
                    stopPolling();
                });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const ssid = document.getElementById('ssid').value;
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            statusEl.textContent = 'Mengirim...';
            statusEl.style.color = 'black';

            const body = new URLSearchParams();
            body.append('ssid', ssid);
            body.append('password', password);

            fetch('/api/wifi-config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            })
                .then(response => response.json())
                .then(data => {
                    if (!data.success) {
                        statusEl.textContent = data.message;
                        statusEl.style.color = 'red';
                        submitBtn.disabled = false;
                        return;
                    }
                    statusEl.textContent = data.message;
                    pollTimer = setInterval(pollStatus, 1500);
                })
                .catch(error => {
                    statusEl.textContent = 'Error: ' + error.message;
                    statusEl.style.color = 'red';
                    submitBtn.disabled = false;
                });
        });

    </script>  
</body>
</html>
